<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="28 יום של עברית — אוצר מילים, דקדוק, כתיב והבנת הנקרא, בתוך משחק בנייה.">

<body>
<div id="app"><div class="boot">טוען…</div></div>
<script type="module" src="js/main.js"></script>
<script>
  // updateViaCache:'none' — אחרת הדפדפן עלול להגיש sw.js ישן מהמטמון ולהקפיא את האפליקציה על גרסה ישנה
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () =>
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {})
    );
  }
</script>
</body>
</html>
